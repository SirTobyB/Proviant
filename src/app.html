<!doctype html>
<!-- lang wird in hooks.server.ts pro Anfrage ersetzt (siehe transformPageChunk) --><html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover: nötig, damit env(safe-area-inset-*) auf dem iPhone (Notch) greift -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#16a34a" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b111a" />
		<!-- iOS-Homescreen-App -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="LmKumpel" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
