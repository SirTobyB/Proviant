name: Docker-Image bauen und in GHCR veröffentlichen

# Ein Release ist der Version-Tag, nicht der Merge: main baut bewusst *kein*
# Image mehr. Sonst zog jeder Zwischenstand — auch ein halb fertiger — sofort
# als :latest auf den Server, und ein Build dauert 3-6 Minuten, die bei reinen
# Doku- oder Aufraeum-Commits niemand braucht. Geprueft wird main weiterhin,
# das erledigt ci.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Immer nur ein Build gleichzeitig: zwei kurz hintereinander gepushte Tags
# teilen sich denselben gha-Cache und ueberlappende GHCR-Tags — beide blieben
# dabei haengen (zuletzt bis ins 6-Stunden-Timeout). Der zweite wartet jetzt
# und trifft danach einen warmen Cache. Bewusst ohne cancel-in-progress: jeder
# Lauf veroeffentlicht eine eigene Version, ein abgebrochener liesse sie fehlen.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      # contents: write nur wegen des Release-Eintrags am Ende — der Build
      # selbst braucht bloss Lesezugriff.
      contents: write
      packages: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      # QEMU ermöglicht den ARM64-Build auf dem x64-Runner
      - name: QEMU einrichten
        uses: docker/setup-qemu-action@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Wird als Build-Arg ins Image gereicht und in der App angezeigt
      - name: Build-Zeitpunkt bestimmen
        id: buildtime
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # latest=auto setzt :latest genau bei einem Version-Tag (und nicht bei
      # einer Vorabversion wie v2.2.0-rc.1). Der frueher haendisch gesetzte
      # raw-Eintrag hing an {{is_default_branch}} und liefe hier nie mehr an —
      # docker-compose.prod.yml zieht aber :latest, das muss weiter erscheinen.
      # Ein manueller workflow_dispatch bekommt so nur sein sha-Tag und
      # ueberschreibt :latest nicht.
      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sirtobyb/proviant
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Image bauen und pushen (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.buildtime.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Die Releases-Seite wurde bisher von Hand gepflegt und blieb deshalb
      # zweimal leer (v2.2.0 und v2.3.0 bekamen keinen Eintrag, obwohl das
      # Image lief). Jetzt entsteht er zusammen mit dem Image, und der Text
      # kommt aus dem Changelog-Abschnitt der Version — eine Quelle, nicht
      # zwei, die auseinanderlaufen koennen.
      #
      # Bewusst mit dem vorinstallierten `gh` statt einer weiteren
      # Third-Party-Action: eine Release-Pipeline ist die schlechteste Stelle
      # fuer eine zusaetzliche Abhaengigkeit.
      #
      # Nur bei einem echten Tag-Push. Ein workflow_dispatch baut ein
      # sha-Image ohne Versionsnummer und haette nichts zu veroeffentlichen.
      - name: Release-Notizen aus dem Changelog schneiden
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Abbruch auch bei den Vergleichslinks am Dateiende: sonst zieht der
          # jeweils *letzte* Abschnitt die komplette Linkliste mit hinein.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ein erneut angestossener Lauf darf nicht am schon bestehenden
          # Release scheitern — das Image ist an dieser Stelle bereits draussen.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME existiert bereits — nichts zu tun."
            exit 0
          fi
          # Vorabversionen (v2.4.0-rc.1) nicht als aktuelle Fassung ausweisen
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
            *) prerelease="" ;;
          esac
          if [ "${{ steps.notes.outputs.found }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md $prerelease
          else
            # Kein passender Changelog-Abschnitt: lieber die generierte
            # Commit-Liste als ein leeres Release.
            echo "Kein Changelog-Abschnitt fuer ${GITHUB_REF_NAME#v} gefunden."
            gh release create "$GITHUB_REF_NAME" \
              --title "${GITHUB_REF_NAME#v}" \
              --generate-notes $prerelease
          fi
