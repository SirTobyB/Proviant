# Automatische Abhängigkeits-Updates.
#
# Die Gruppierung ist der eigentliche Kniff: ohne sie öffnet Dependabot für ein
# SvelteKit-Projekt gut ein Dutzend einzelner Pull Requests pro Woche, die sich
# gegenseitig blockieren, weil jeder für sich die package-lock.json anfasst.
# Zusammengehörige Pakete (SvelteKit, Tailwind, Drizzle) müssen ohnehin
# gemeinsam angehoben werden.
#
# Sicherheitsrelevante Updates kommen unabhängig von diesem Zeitplan sofort —
# dafür müssen im Repository unter Settings → Code security die
# „Dependabot alerts" und die „Dependabot security updates" aktiv sein.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # Die Gruppen dürfen sich nicht überschneiden: In diesem Projekt sind
    # SvelteKit, Tailwind, Vite und Drizzle allesamt devDependencies, eine
    # Gruppe „alle Entwicklungspakete" verschluckt also jede feinere Gruppe
    # daneben (genau das ist passiert — ein Sammel-PR ersetzte drei einzelne).
    # Deshalb nur noch zwei Gruppen, und die Ausnahme wird ausdrücklich
    # ausgeschlossen statt vorangestellt.
    groups:
      # barcode-detector und zxing-wasm müssen dieselbe Version tragen
      # (src/lib/zxingVersion.test.ts wacht darüber) — also nie einzeln anheben.
      barcode:
        patterns: ['barcode-detector', 'zxing-wasm']
      werkzeug:
        dependency-type: development
        update-types: ['minor', 'patch']
      laufzeit:
        dependency-type: production
        update-types: ['minor', 'patch']
        exclude-patterns: ['barcode-detector', 'zxing-wasm']
    # Majors von better-sqlite3 bleiben Handarbeit — aus demselben Grund wie
    # beim Basis-Image, nur schärfer: Die gesamte 13er-Linie liefert **keine**
    # vorgebauten Binaries (v12.11.1: 138 Stück inkl. linuxmusl, v13.0.0 und
    # v13.0.3: null). Das Image müsste den Treiber bei jedem Build aus dem
    # Quelltext übersetzen, für arm64 unter QEMU-Emulation — dort ist dieses
    # Projekt schon einmal bis ins 6-Stunden-Timeout gelaufen.
    #
    # Geprüft ist v13 im Übrigen unauffällig: Migrationen, Transaktionen,
    # Fremdschlüssel und Upserts laufen mit drizzle-orm 0.45.2 durch. Es fehlen
    # nur die Binaries. Sobald die 13er-Linie welche mitbringt, kann die Regel
    # weg — ebenso, wenn eine Schwachstelle auftaucht, die nur v13 behebt.
    #
    # Achtung: Die CI kann diese Entscheidung nicht abnehmen. Kein Test fasst
    # die Datenbank an, der Build öffnet sie nicht, die Typen kommen aus dem
    # eigenständig versionierten @types/better-sqlite3, und der Runner läuft auf
    # glibc statt musl. Ein grüner Haken sagt hier nichts.
    ignore:
      - dependency-name: better-sqlite3
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: Aktualisiere

  # Basis-Image des Containers (node:22-alpine im Dockerfile)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Node-Majors bleiben Handarbeit. `better-sqlite3` ist ein natives Modul:
    # Für eine frische Major gibt es oft noch keine vorgebauten Binaries, dann
    # kompiliert der Container-Build selbst — für arm64 unter QEMU langsam bis
    # brüchig. Dazu will die Frage, ob die Version schon LTS ist, bewusst
    # beantwortet werden (Dependabot schlug 22 → 26 vor und übersprang 24).
    # Sicherheits-Updates innerhalb der Linie kommen weiterhin.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: Aktualisiere

  # Die in .github/workflows/docker.yml verwendeten Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: Aktualisiere
