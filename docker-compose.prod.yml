# Produktions-Compose für den Server: zieht das fertige Image aus der
# GitHub Container Registry statt lokal zu bauen.
#
# Einmalig:  docker login ghcr.io -u DEIN-GITHUB-NAME   (PAT mit Scope
#            read:packages) — nur nötig, solange das GHCR-Paket privat ist.
# Vorher:    .env.example als .env neben diese Datei kopieren und ausfüllen
#            (Zugangsdaten und erster Admin, siehe environment unten)
# Start:     docker compose -f docker-compose.prod.yml up -d
# Update:    docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
#
# Traefik-Anbindung: setzt voraus, dass Traefik im externen Netzwerk "proxy"
# hängt und einen websecure-Entrypoint + Certresolver "tls_resolver" hat.
# Passe die mit "<-- anpassen" markierten Stellen an.
#
# Erster Start: Beim ersten Öffnen der Seite "Bestellen" einmal mit Picnic
# verbinden (Login + SMS-2FA). Der Auth-Key wird im Volume ./data abgelegt
# und übersteht Neustarts — die 2FA fällt danach nur noch selten an.
services:
  proviant:
    image: ghcr.io/sirtobyb/proviant:latest
    container_name: proviant
    restart: unless-stopped
    # Direkter Port nicht nötig, da Traefik den Traffic reinreicht.
    # Für lokales Debugging kannst du die Zeilen wieder einkommentieren.
    # ports:
    #   - "3000:3000"
    volumes:
      # Enthält SQLite-Datenbank, Artikelbilder und den Picnic-Auth-Key
      - ./data:/data
    environment:
      # Öffentliche URL der App — adapter-node braucht sie für den
      # CSRF-Schutz der Formulare. MUSS zur Host-Regel unten passen.
      ORIGIN: "https://proviant.example.de" # <-- anpassen
      # Zugangsdaten stehen bewusst NICHT in dieser Datei, sondern in einer
      # .env daneben (docker compose liest sie automatisch; in Portainer unter
      # "Environment variables"). Vorlage: .env.example. So landet kein
      # Passwort in einer Datei, die man versioniert oder weitergibt, und
      # niemand übernimmt versehentlich einen Beispielwert.
      # Werte mit $ oder # in der .env in einfache Anführungszeichen setzen.
      PICNIC_USERNAME: ${PICNIC_USERNAME}
      PICNIC_PASSWORD: ${PICNIC_PASSWORD}
      # Erster Admin-Benutzer — nur beim allerersten Start angelegt (wenn noch
      # kein Benutzer existiert). Das Passwort braucht mindestens 12 Zeichen,
      # sonst wird kein Admin angelegt (siehe Container-Log).
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.proviant.rule=Host(`proviant.example.de`)" # <-- anpassen
      - "traefik.http.routers.proviant.entrypoints=websecure"
      - "traefik.http.routers.proviant.tls.certresolver=tls_resolver"
      - "traefik.http.services.proviant.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
