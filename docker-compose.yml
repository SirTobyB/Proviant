services:
  proviant:
    build: .
    container_name: proviant
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      # Öffentliche URL der App; adapter-node braucht das für den
      # CSRF-Schutz bei Formularen (hinter Traefik anpassen).
      ORIGIN: "http://localhost:3000"
      # Zugangsdaten für den Picnic-Account
      PICNIC_USERNAME: ""
      PICNIC_PASSWORD: ""
      # Erster Admin (nur beim allerersten Start angelegt)
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "admin"
      ADMIN_EMAIL: "admin@example.de"
