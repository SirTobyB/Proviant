services:
  proviant:
    build: .
    container_name: proviant
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      # Öffentliche URL der App; adapter-node braucht das für den
      # CSRF-Schutz bei Formularen (hinter Traefik anpassen).
      ORIGIN: "http://localhost:3000"
      # Zugangsdaten aus der .env im Projektstamm (Vorlage: .env.example) —
      # dieselbe Datei, die auch npm run dev liest
      PICNIC_USERNAME: ${PICNIC_USERNAME:-}
      PICNIC_PASSWORD: ${PICNIC_PASSWORD:-}
      # Erster Admin (nur beim allerersten Start angelegt, Passwort ≥ 12 Zeichen)
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
